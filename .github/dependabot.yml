version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["ci"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    groups:
      dev:
        patterns: ["ruff", "mypy", "pytest*", "hypothesis", "pre-commit"]
