name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo a la misma rama o PR cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Formato, lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Sincronizar dependencias (lockfile)
        run: uv sync --locked --extra dev
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: MyPy strict
        run: uv run mypy --strict src

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sincronizar dependencias (lockfile)
        run: uv sync --locked --extra dev
      - name: Tests con cobertura
        if: runner.os == 'Linux'
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Tests
        if: runner.os != 'Linux'
        run: uv run pytest -q
      - name: Smoke sin ventana (motor 2026)
        run: uv run pop2026 --demo --seed 42 --frames 120 --headless
      - name: Smoke sin ventana (motor canon)
        run: uv run pop2026canon --headless --frames 120
      - name: Cobertura como artefacto
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  build:
    name: Paquete (wheel y sdist)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Construir
        run: uv build
      - name: Instalar el wheel en un entorno limpio y arrancar
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
          /tmp/wheel-env/bin/pop2026canon --headless --frames 30
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          retention-days: 14
